spring.application.name=smart-attendance
# MySQL is the default database. Set DB_PASSWORD in your environment before starting.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_attendance}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
